server {
  listen 80;
  server_name code-critters.fim.uni-passau.de;
  server_tokens off;
  client_max_body_size 100M;

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
      return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl;
  server_name code-critters.fim.uni-passau.de;

  ssl_certificate /etc/letsencrypt/live/code-critters.fim.uni-passau.de/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/code-critters.fim.uni-passau.de/privkey.pem;

  include /etc/letsencrypt/options-ssl-nginx.conf;
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

  client_max_body_size 100M;

  location / {
    proxy_http_version 1.1;
    proxy_connect_timeout 300;
    proxy_send_timeout 300;
    proxy_read_timeout 300;
    send_timeout 300;
    proxy_pass http://app:8080;
  }
}
