#spring.config.name=file:./resources/application.properties
# To read .env file:
spring.config.import=optional:file:.env[.properties]
logging.level.org.springframework=INFO

spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=validate
spring.datasource.initialization-mode=always
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

#For Flyway database migration
spring.flyway.locations=classpath:db/migration
spring.flyway.placeholder-replacement=false
spring.flyway.enabled=true
spring.flyway.baselineOnMigrate=false

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=${MYSQLDB_URL}
spring.datasource.username=${MYSQLDB_USER}
spring.datasource.password=${MYSQLDB_ROOT_PASSWORD}
server.port=8080

#Use this for email testing purposes; emails will only be sent to mailhog
#spring.mail.host=localhost
#spring.mail.port=1025
#spring.mail.username=mailhog
#spring.mail.password=mailhog
#spring.mail.address=test@mailhog.org

spring.mail.host=${MAIL_HOST}
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.address=${MAIL_ADDRESS}
spring.mail.personal=Code Critters
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

#timeout in minutes
server.servlet.session.timeout=600
