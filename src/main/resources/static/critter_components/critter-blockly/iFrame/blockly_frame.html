<html>
<meta http-equiv="content-type"
      content="application/xhtml+xml; charset=utf-8"/>
<head>
  <script src="/static/blockly/blockly_compressed.js"></script>
  <script src="/static/blockly/blocks_compressed.js"></script>
  <script src="/static/blockly/javascript_compressed.js"></script>
  <script src="/static/blockly/msg/en.js" id="lang_script"></script>
  <script src="/translation/customBlocks/customBlocks_en.js" id="custom_blocks"></script>
  <script src="/customBlocks.js"></script>


</head>
<body>

<style>
  #blocklyArea {
    width: 100%;
    height: 100%;
  }
  body {
    margin: 0;
  }
</style>

<div id="blocklyArea" style="position: absolute">
  <div id="blocklyDiv" style="position: absolute"></div>
  <xml id="toolbox" style="display: none">
  </xml>
</div>

<script>
  var ready = false;
  var showToolbox = false;
  var showControls = false;
  var showTrashcan = false;
  var readOnly = false;
  var blocklyCode = '';
  var blocklyArea = document.getElementById('blocklyArea');
  var blocklyDiv = document.getElementById('blocklyDiv');
  var toolbox = document.getElementById('toolbox');
  var workspace = null;
  var inHintMode = false;
  var inLoopLevel = false;


  /**
   * Sets the scale of blocks based on the size of the blockly window
   * and whether it contains a toolbox or not.
   */
  const setBlockScale = function () {
    if (this.showToolbox) {
      if (this.inLoopLevel) {
        this.workspace.setScale(1.0);
      } else {
        this.workspace.setScale(0.7)
      }
    } else if (window.matchMedia("(max-width: 500px)").matches) {
      this.workspace.setScale(0.6);
    } else if (window.matchMedia("(max-width: 600px)").matches) {
      this.workspace.setScale(0.7);
    } else if (window.matchMedia("(max-width: 700px)").matches) {
      this.workspace.setScale(0.8);
    } else {
      this.workspace.setScale(1.0);
    }
  }

  var onresize = function(e) {
    // Compute the absolute coordinates and dimensions of blocklyArea.
    var element = blocklyArea;
    var x = 0;
    var y = 0;
    do {
      x += element.offsetLeft;
      y += element.offsetTop;
      element = element.offsetParent;
    } while (element);
    // Position blocklyDiv over blocklyArea.
    blocklyDiv.style.left = x + 'px';
    blocklyDiv.style.top = y + 'px';
    blocklyDiv.style.width = blocklyArea.offsetWidth + 'px';
    blocklyDiv.style.height = blocklyArea.offsetHeight + 'px';
  };

  // isCut to decide whether to attach validity check listener
  var renderBlockly = function(isCut = true){
    this.blocklyDiv.innerHTML = '';
      this.workspace = Blockly.inject('blocklyDiv',
              {toolbox: this.showToolbox ? this.toolbox : null,
                zoom:
                        {controls: showControls,
                          wheel: showControls,
                          startScale: 0.8,
                          maxScale: 2,
                          minScale: 0.3,
                          scaleSpeed: 1.2},
                trashcan: showTrashcan,
                readOnly: readOnly,
                scrollbars:  true
              });
    if(window.matchMedia("(max-width: 600px)").matches) {
      this.blocklyDiv.innerHTML = '';
      this.workspace = Blockly.inject('blocklyDiv',
              {toolbox: this.showToolbox ? this.toolbox : null,
                zoom:
                        {controls: showControls,
                          wheel: showControls,
                          startScale: 0.5,
                          maxScale: 1,
                          minScale: 0.3,
                          scaleSpeed: 1.2},
                readOnly: readOnly,
                scrollbars:  true
              });
    }

    if(blocklyCode) {
      var xml = Blockly.utils.xml.textToDom(blocklyCode);
      Blockly.Xml.domToWorkspace(xml, this.workspace);
      setBlockScale();
      this.workspace.scrollCenter();
    }

    if (!isCut) { // add validity check listener only to tests
      this.workspace.addChangeListener(this._onWorkspaceChange);
    }
  };

  renderBlockly();
  window.addEventListener('resize', onresize, false);
  onresize();
  Blockly.svgResize(workspace);
  window.dispatchEvent(new CustomEvent("_blocklyReady", {detail: {}, bubbles: true, composed: true}));
  ready = true;

  var setToolbox = function(newToolbox, isCut = false){
    toolbox.innerHTML = newToolbox;
    if(newToolbox){
      showToolbox = true;
    }
    renderBlockly(isCut);
  };

  /**
   * Sets the color of a block to its original color (if it has been modified before).
   * @param blockId of the block to reset
   */
  var setDefaultBlockColor = function (blockId) {
    const block = getBlockById(blockId);
    if (block) {
      if (block.originalColour) {
        block.setColour(block.originalColour);
        workspace.render();
      }
    }
  }

  /**
   * Changes the color of a block.
   * @param blockId of the wanted block
   * @param newColor string of the color hex code
   */
  var highlightBlockWithColor = function (blockId, newColor) {
    const block = getBlockById(blockId);
    if (block) {
      if (!newColor) {
        block.originalColour = block.originalColour ? block.originalColour : block.getColour();
        block.setColour(block.originalColour); // nothing changes
      } else {
        block.originalColour = block.originalColour ? block.originalColour : block.getColour();
        block.setColour(newColor)
        workspace.render();
      }
    }
  }


  /**
   * Adds a border around a block with given id to highlight. If no color is given, the border is red.
   * @param blockId
   * @param borderColor
   */
  var highlightBlockWithBorder = function (blockId, borderColor) {
    const block = getBlockById(blockId);
    if (block) {
      const svgGroup = block.getSvgRoot();
      if (svgGroup) {
        // remove any existing border first
        const existingHighlight = svgGroup.getElementsByClassName('blocklyHighlightBorder');
        if (existingHighlight.length > 0) {
          existingHighlight[0].remove();
        }

        // add new border
        const rect = document.createElementNS("http://www.w3.org/2000/svg", "rect");
        rect.setAttribute("class", "blocklyHighlightBorder");
        rect.setAttribute("x", -2);
        rect.setAttribute("y", -2);
        rect.setAttribute("width", block.width + 4);
        rect.setAttribute("height", block.height + 4);
        rect.setAttribute("stroke", borderColor || "#FF0000"); // Default to red border
        rect.setAttribute("stroke-width", 4);
        rect.setAttribute("fill", "none");
        svgGroup.insertBefore(rect, svgGroup.firstChild);
      }
      workspace.render();
    }
  };

  /**
   * Removes the highlighting border of a block with given id.
   * @param blockId
   */
  var setDefaultBorderColor = function (blockId) {
    const block = getBlockById(blockId);
    if (block) {
      const svgGroup = block.getSvgRoot();
      if (svgGroup) {
        const existingHighlight = svgGroup.getElementsByClassName('blocklyHighlightBorder');
        if (existingHighlight.length > 0) {
          existingHighlight[0].remove();
        }
      }
      workspace.render();
    }
  }

  /**
   * During hint mode events are thrown to inform the game about user interactions in the blockly frame.
   */
  var setInHintMode = function(isHintMode) {
    inHintMode = isHintMode;
  }

  var setControls = function(controls, isCut = false){
    showControls = controls;
    renderBlockly(isCut);
  };

  var setTrashcan = function(trashcan, isCut = false){
    showTrashcan = trashcan;
    renderBlockly(isCut);
  };

  var setCode = function(newCode, isCut = false){
    blocklyCode = newCode;
    renderBlockly(isCut);
  };

  var setReadOnly = function(disabled, isCut = false){
      readOnly = disabled;
      renderBlockly(isCut);
  };

  var setIsInLoopLevel = function(isLoopLevel, isCut = false) {
    inLoopLevel = isLoopLevel;
    renderBlockly(isCut);
  }

  var getCode = function() {
    var jsCode = Blockly.JavaScript.workspaceToCode(workspace);
    return jsCode;
  };

  var getXML = function() {
    var xml = Blockly.Xml.workspaceToDom(workspace);
    var xml_text = Blockly.Xml.domToText(xml);
    return xml_text;
  };

  var getBlockById = function(id) {
      return  workspace.getBlockById(id);
  };

  var getBlockNumber = function () {
      if (workspace) {
          return workspace.getAllBlocks().length;
      }
      return 0;
  }

  var getMetrics = function () {
    return workspace.getMetrics();
  }

  var changeLanguage = async function(langTag, isCut = false) {
    document.getElementById("lang_script").remove();
    //document.getElementById("customBlocks").remove();
    var scriptLang = document.createElement("script");
    var scriptCustom = document.createElement("script");
    var xml = getXML();
    scriptLang.id = "lang_script";
    scriptLang.src = "/static/blockly/msg/" + langTag + ".js";
    scriptCustom.id = "custom_blocks";
    scriptCustom.src = "/translation/customBlocks/customBlocks_" + langTag + ".js";

    var promises = [];
    promises.push(new Promise(resolve => {
              scriptLang.addEventListener('load', function () {
                resolve();
              });
            })
    );

    promises.push(new Promise(resolve => {
      scriptCustom.addEventListener('load', function () {
        resolve();
              });
          })
    );

    document.getElementsByTagName('head')[0].appendChild(scriptLang);
    document.getElementsByTagName('head')[0].appendChild(scriptCustom);

    await Promise.all(promises);
    workspace.dispose();
    renderBlockly(isCut);
  };


  /**
   * Checks validity of an assertions and comparisons (e.g. logic_compare blocks). It takes the current block as input.
   * @param currentBlock block (child of assert-block/compare-block) that is moved/changed right now
   */
  const _checkAssertValidity = function (currentBlock) {
    const parentBlock = currentBlock.parentBlock_;

    if (parentBlock && parentBlock.childBlocks_ && parentBlock.childBlocks_.length === 2) { // assert stmt is complete
      const childBlocks = parentBlock.childBlocks_;
      let secondOperandBlock;
      if (childBlocks[0].id === currentBlock.id) {
        secondOperandBlock = childBlocks[1];
      } else {
        secondOperandBlock = childBlocks[0];
      }

      const operandsCode = getAssertOperandsJsCode(parentBlock);

      let firstOperand = "";
      let secondOperand = "";
      if (operandsCode.length === 2) {
        firstOperand = operandsCode[0];
        secondOperand = operandsCode[1]
      }

      // Initialize the Blockly JavaScript code generator to safely call Javascript
      Blockly.JavaScript.init(workspace);
      const jsCodeOfCurrentBlock = Blockly.JavaScript.blockToCode(currentBlock) ?
              removeBlocklyOrderFromBlockCode(Blockly.JavaScript.blockToCode(currentBlock).toString()) : "";

      // Find out which jsCode corresponds to which operand block
      let currentOperand;
      let otherOperand;
      if ((firstOperand.includes(jsCodeOfCurrentBlock)) || (jsCodeOfCurrentBlock.includes(firstOperand))) {
        currentOperand = firstOperand;
        otherOperand = secondOperand;
      } else if ((secondOperand.includes(jsCodeOfCurrentBlock)) || (jsCodeOfCurrentBlock.includes(secondOperand))) {
        currentOperand = secondOperand;
        otherOperand = firstOperand;
      } else { // not building an assertion with the current block
        return;
      }
      checkValidityOfOperands(currentOperand, otherOperand, currentBlock, secondOperandBlock);
    } else {
      // do nothing, assert stmt is not complete yet
    }
  }

  /**
   * Highlights the affected blocks temporarily. They blink in red for two times.
   * @param firstOperandBlock
   * @param secondOperandBlock
   */
  const highlightAssertBlocks = function (firstOperandBlock, secondOperandBlock) {
    // Save the original colors to revert back later
    firstOperandBlock.originalColour = firstOperandBlock.originalColour ? firstOperandBlock.originalColour : firstOperandBlock.getColour();
    secondOperandBlock.originalColour = secondOperandBlock.originalColour ? secondOperandBlock.originalColour : secondOperandBlock.getColour();

    let blinkCount = 3; // Number of times to blink
    let blinkToggle = true;

    firstOperandBlock.setColour('#ff0000');
    secondOperandBlock.setColour('#ff0000');

    const blinkInterval = setInterval(() => {
      // Toggle between original color and red
      if (blinkToggle) {
        firstOperandBlock.setColour(firstOperandBlock.originalColour);
        secondOperandBlock.setColour(secondOperandBlock.originalColour);
      } else {
        firstOperandBlock.setColour('#ff0000');
        secondOperandBlock.setColour('#ff0000');
      }
      blinkToggle = !blinkToggle;
      workspace.render();
      blinkCount--;

      if (blinkCount === 0) {
        // Clear interval after blinking is done and revert color of blocks to original
        clearInterval(blinkInterval);
        firstOperandBlock.setColour(firstOperandBlock.originalColour);
        secondOperandBlock.setColour(secondOperandBlock.originalColour);
        workspace.render();
      }
    }, 500);
  };

  /**
   * Highlights the affected blocktemporarily. Blinks in red for two times.
   * @param firstOperandBlock
   */
  const highlightOneBlock = function (block) {
    // Save the original colors to revert back later
     block.originalColour = block.originalColour ? block.originalColour : block.getColour();

    let blinkCount = 3; // Number of times to blink
    let blinkToggle = true;

    block.setColour('#ff0000');

    const blinkInterval = setInterval(() => {
      // Toggle between original color and red
      if (blinkToggle) {
        block.setColour(block.originalColour);
      } else {
        block.setColour('#ff0000');
      }
      blinkToggle = !blinkToggle;
      workspace.render();
      blinkCount--;

      if (blinkCount === 0) {
        // Clear interval after blinking is done and revert color of blocks to original
        clearInterval(blinkInterval);
        block.setColour(block.originalColour);
        workspace.render();
      }
    }, 500);
  };

  /**
   * Returns an array of max length of 2 containing the js code of the assert operands
   */
  const getAssertOperandsJsCode = function (parentBlock) {
    Blockly.JavaScript.init(workspace);
    const jsCode = Blockly.JavaScript.blockToCode(parentBlock) ?
            removeBlocklyOrderFromBlockCode(Blockly.JavaScript.blockToCode(parentBlock).toString()) : "";
    const jsString = jsCode.toString();

    let regex;
    let matches = [];
    let match;
    if (parentBlock && (parentBlock.type === "assert" || parentBlock.type === "assert_loop")) {
      regex = /if\s*\((.*?)\s*!==\s*(.*?)\)\s*{/g; // look only at code inside assert (i.e. the two operands of the if-condition)
      while ((match = regex.exec(jsString)) !== null) {
        matches.push(match[1], match[2]);
      }
    } else if (parentBlock && (parentBlock.type === "logic_compare")) {
      const regexes = [
        /(.*?)\s* == \s*(.*)/g,
        /(.*?)\s* <= \s*(.*)/g,
        /(.*?)\s* < \s*(.*)/g,
        /(.*?)\s* >= \s*(.*)/g,
        /(.*?)\s* > \s*(.*)/g,
      ];

      // Iterate through each regex pattern
      regexes.forEach((regex) => {
        while (((match = regex.exec(jsString)) !== null) && matches.length < 2) {
          matches.push(match[1], match[2]);
        }
      });
    }
    return matches;
  }

  /**
   * Checks validity of asserts. Checks the two inputs of the assert for matching types
   * and throws events if comparison is invalid
   * @param currentOperandCode js code of the currently moved block in the assert
   * @param otherOperandCode js code of the other assert operand
   * @param currentBlock current block
   * @param otherOperandBlock other assert operand block
   */
  const checkValidityOfOperands =  function (currentOperandCode, otherOperandCode, currentBlock, otherOperandBlock) {
    const allColorsRegex = /\b(red|blue|cyan|green|orange|yellow|grey|black|pink|blond|brown|white)\b/;
    const allNumPropertiesRegex = /\b( % | > | < |mathIsPrime | == | != | <= | >= | )\b/;

    if (currentBlock.type === "math_arithmetic") {
      validityCheckWithNumber(otherOperandCode, "math_number", otherOperandBlock.type, currentBlock, otherOperandBlock);
    } else if (currentBlock.type === "logic_compare" || currentBlock.type === "math_number_property" || currentBlock.type === "logic_operation") {
      validityCheckWithBools(otherOperandCode, otherOperandBlock.type, currentBlock, otherOperandBlock);
    } else if (currentOperandCode.match(/\b(color)\b/)) { // is critter.shirtColor block
      validityCheckWithColor(otherOperandCode, "shirtcolor_prop", otherOperandBlock.type, currentBlock, otherOperandBlock);
    } else if (currentOperandCode.match(/\b(hair)\b/)) { // is critter.haircolor block
      validityCheckWithColor(otherOperandCode, "haircolor_prop", otherOperandBlock.type, currentBlock, otherOperandBlock);
    } else if (currentOperandCode.match(/\b(size)\b/)) { // is critter.size block
      validityCheckWithNumber(otherOperandCode, "size_prop", otherOperandBlock.type, currentBlock, otherOperandBlock);
    } else if (currentOperandCode.match(/\b(roundsCount)\b/) || currentOperandCode.match(/\b(innerRoundsCount)\b/)) { // is critter.roundsCount block
      validityCheckWithNumber(otherOperandCode, "rounds_count_prop", otherOperandBlock.type, currentBlock, otherOperandBlock);
    } else if (currentOperandCode.match(/\b\w*BerryCount\w*\b/)) { // is critter.berryCount block (for all colors)
      validityCheckWithNumber(otherOperandCode, "berry_count_prop", otherOperandBlock.type, currentBlock, otherOperandBlock);
    } else if (currentOperandCode.match(allColorsRegex)) { // is hair or shirt color picker block
      validityCheckWithColor(otherOperandCode, currentBlock.type, otherOperandBlock.type, currentBlock, otherOperandBlock);
    } else if (currentOperandCode.match(/\d+/)) {
      if (currentOperandCode.match(allNumPropertiesRegex)) { // is number props block, e.g. '3 is even'
        validityCheckWithBools(otherOperandCode, otherOperandBlock.type, currentBlock, otherOperandBlock)
      } else { // is simple number block
        validityCheckWithNumber(otherOperandCode, currentBlock.type, otherOperandBlock.type, currentBlock, otherOperandBlock);
      }
    }
  }

  /**
   * Throws event if current block (boolean type) causes invalid assert comparision
   * @param otherOperand js code of the other assert operand
   * @param otherOperandBlockType block type of the other operand
   * @param currentBlock current block
   * @param otherOperandBlock other assert operand block
   */
  const validityCheckWithBools = function (otherOperand, otherOperandBlockType, currentBlock, otherOperandBlock) {
    const allColorsRegex = /\b(red|blue|cyan|green|orange|yellow|grey|black|pink|blond|brown|white)\b/;

    if (otherOperandBlockType === "math_arithmetic") {
      window.dispatchEvent(new CustomEvent("_invalidComparison", {detail: { curBlockType: "logic_compare", comparedWith: "number" }, bubbles: true, composed: true}));
      highlightAssertBlocks(currentBlock, otherOperandBlock);
    } else if (otherOperand.match(/\b(color)\b/)) {
      window.dispatchEvent(new CustomEvent("_invalidComparison", {detail: { curBlockType: "logic_compare", comparedWith: "shirtcolor_prop" }, bubbles: true, composed: true}));
      highlightAssertBlocks(currentBlock, otherOperandBlock);
    } else if (otherOperand.match(/\b(hair)\b/)) {
      window.dispatchEvent(new CustomEvent("_invalidComparison", {detail: { curBlockType: "logic_compare", comparedWith: "haircolor_prop" }, bubbles: true, composed: true}));
      highlightAssertBlocks(currentBlock, otherOperandBlock);
    } else if (otherOperand.match(allColorsRegex)) {
      if (otherOperandBlockType === "hair_picker") {
        window.dispatchEvent(new CustomEvent("_invalidComparison", {detail: { curBlockType: "logic_compare", comparedWith: "hair_picker" }, bubbles: true, composed: true}));
        highlightAssertBlocks(currentBlock, otherOperandBlock);
      } else if (otherOperandBlockType === "shirt_picker") {
        window.dispatchEvent(new CustomEvent("_invalidComparison", {detail: { curBlockType: "logic_compare", comparedWith: "shirt_picker" }, bubbles: true, composed: true}));
        highlightAssertBlocks(currentBlock, otherOperandBlock);
      }
    }

    // if compared to numbers (not inside a boolean block)
    if (!(otherOperandBlockType === "logic_compare" || otherOperandBlockType === "logic_compare" || otherOperandBlockType === "logic_operation")) {
      if (otherOperand.match(/\d+/)) {
        window.dispatchEvent(new CustomEvent("_invalidComparison", {detail: { curBlockType: "logic_compare", comparedWith: "number" }, bubbles: true, composed: true}));
        highlightAssertBlocks(currentBlock, otherOperandBlock);
      } else if (otherOperand.match(/\b(size)\b/)) {
        window.dispatchEvent(new CustomEvent("_invalidComparison", {detail: { curBlockType: "logic_compare", comparedWith: "size_prop"}, bubbles: true, composed: true}));
        highlightAssertBlocks(currentBlock, otherOperandBlock);
      } else if (otherOperand.match(/\b(roundsCount)\b/) || otherOperand.match(/\b(innerRoundsCount)\b/)) {
        window.dispatchEvent(new CustomEvent("_invalidComparison", {detail: { curBlockType: "logic_compare", comparedWith: "rounds_count_prop"}, bubbles: true, composed: true}));
        highlightAssertBlocks(currentBlock, otherOperandBlock);
      } else if (otherOperand.match(/\b\w*BerryCount\w*\b/)) {
        window.dispatchEvent(new CustomEvent("_invalidComparison", {detail: { curBlockType: "logic_compare", comparedWith: "berry_count_prop"}, bubbles: true, composed: true}));
        highlightAssertBlocks(currentBlock, otherOperandBlock);
      }
    }
  }

  /**
   * Throws event if current block (number type, i.e. either number of size) causes invalid assert comparision
   * @param otherOperand js code of the other assert operand
   * @param curBlockType current block type
   * @param otherOperandBlockType block type of the other operand
   * @param currentBlock current block
   * @param otherOperandBlock other assert operand block
   */
  const validityCheckWithNumber = function (otherOperand, curBlockType, otherOperandBlockType, currentBlock, otherOperandBlock) {
    const allColorsRegex = /\b(red|blue|cyan|green|orange|yellow|grey|black|pink|blond|brown|white)\b/;
    const allNumPropertiesRegex = /\b( % | > | < |mathIsPrime | == | != | <= | >= | )\b/;

    if (otherOperandBlockType === "logic_compare" || otherOperandBlockType === "math_number_property" || otherOperandBlockType === "logic_operation") {
      window.dispatchEvent(new CustomEvent("_invalidComparison", {detail: { curBlockType, comparedWith: "logic_compare" }, bubbles: true, composed: true}));
      highlightAssertBlocks(currentBlock, otherOperandBlock);
    } else if (otherOperand.match(/\b(color)\b/)) {
      window.dispatchEvent(new CustomEvent("_invalidComparison", {detail: { curBlockType, comparedWith: "shirtcolor_prop" }, bubbles: true, composed: true}));
      highlightAssertBlocks(currentBlock, otherOperandBlock);
    } else if (otherOperand.match(/\b(hair)\b/)) {
      window.dispatchEvent(new CustomEvent("_invalidComparison", {detail: { curBlockType, comparedWith: "haircolor_prop" }, bubbles: true, composed: true}));
      highlightAssertBlocks(currentBlock, otherOperandBlock);
    } else if (otherOperand.match(allColorsRegex)) {
      if (otherOperandBlockType === "hair_picker") {
        window.dispatchEvent(new CustomEvent("_invalidComparison", {detail: { curBlockType, comparedWith: "hair_picker" }, bubbles: true, composed: true}));
        highlightAssertBlocks(currentBlock, otherOperandBlock);
      } else if (otherOperandBlockType === "shirt_picker") {
        window.dispatchEvent(new CustomEvent("_invalidComparison", {detail: { curBlockType, comparedWith: "shirt_picker" }, bubbles: true, composed: true}));
        highlightAssertBlocks(currentBlock, otherOperandBlock);
      }
    } else if (otherOperand.match(allNumPropertiesRegex)) {
      window.dispatchEvent(new CustomEvent("_invalidComparison", {detail: { curBlockType, comparedWith: "math_number_property" }, bubbles: true, composed: true}));
      highlightAssertBlocks(currentBlock, otherOperandBlock);
    }
  }

  /**
   * Throws event if current block (hair or shirt color type) causes invalid assert comparison
   * @param otherOperand js code of the other assert operand
   * @param curBlockType block type of the current block
   * @param otherOperandBlockType block type of the other operand
   * @param currentBlock current block
   * @param otherOperandBlock other assert operand block
   */
  const validityCheckWithColor = function (otherOperand, curBlockType, otherOperandBlockType, currentBlock, otherOperandBlock) {
    const allNumPropertiesRegex = /\b( % | > | < |mathIsPrime | == | != | <= | >= | )\b/;
    const allColorsRegex = /\b(red|blue|cyan|green|orange|yellow|grey|black|pink|blond|brown|white)\b/;

    if (otherOperandBlockType === "math_arithmetic") {
      window.dispatchEvent(new CustomEvent("_invalidComparison", {detail: { curBlockType, comparedWith: "number" }, bubbles: true, composed: true}));
      highlightAssertBlocks(currentBlock, otherOperandBlock);
    } else if (otherOperandBlockType === "logic_compare" || otherOperandBlockType === "math_number_property" || otherOperandBlockType === "logic_operation") {
      window.dispatchEvent(new CustomEvent("_invalidComparison", {detail: { curBlockType, comparedWith: "logic_compare" }, bubbles: true, composed: true}));
      highlightAssertBlocks(currentBlock, otherOperandBlock);
    } else if (otherOperand.match(/\b(size)\b/)) {
      window.dispatchEvent(new CustomEvent("_invalidComparison", {detail: { curBlockType, comparedWith: "size_prop" }, bubbles: true, composed: true}));
      highlightAssertBlocks(currentBlock, otherOperandBlock);
    } else if (otherOperand.match(/\b(roundsCount)\b/) || otherOperand.match(/\b(innerRoundsCount)\b/)) {
      window.dispatchEvent(new CustomEvent("_invalidComparison", {detail: { curBlockType, comparedWith: "rounds_count_prop" }, bubbles: true, composed: true}));
      highlightAssertBlocks(currentBlock, otherOperandBlock);
    } else if (otherOperand.match(/\b\w*BerryCount\w*\b/)) {
      window.dispatchEvent(new CustomEvent("_invalidComparison", {detail: { curBlockType, comparedWith: "berry_count_prop" }, bubbles: true, composed: true}));
      highlightAssertBlocks(currentBlock, otherOperandBlock);
    } else if (otherOperand.match(/\d+/)) {
      if (otherOperand.match(allNumPropertiesRegex)) {
        window.dispatchEvent(new CustomEvent("_invalidComparison", {detail: { curBlockType, comparedWith: "math_number_property" }, bubbles: true, composed: true}));
        highlightAssertBlocks(currentBlock, otherOperandBlock);
      } else {
        window.dispatchEvent(new CustomEvent("_invalidComparison", {detail: { curBlockType, comparedWith: "number" }, bubbles: true, composed: true}));
        highlightAssertBlocks(currentBlock, otherOperandBlock);
      }
    } else if (curBlockType === "haircolor_prop" || curBlockType === "hair_picker") {
      if (otherOperand.match(allColorsRegex) && otherOperandBlockType === "shirt_picker") {
        window.dispatchEvent(new CustomEvent("_invalidComparison", {detail: { curBlockType, comparedWith: "shirt_picker" }, bubbles: true, composed: true}));
        highlightAssertBlocks(currentBlock, otherOperandBlock);
      } else if (otherOperand.match(/\b(color)\b/)) {
        window.dispatchEvent(new CustomEvent("_invalidComparison", {detail: { curBlockType, comparedWith: "shirtcolor_prop" }, bubbles: true, composed: true}));
        highlightAssertBlocks(currentBlock, otherOperandBlock);
      }
    } else if (curBlockType === "shirtcolor_prop" || curBlockType === "shirt_picker"){
      if (otherOperand.match(allColorsRegex) && otherOperandBlockType === "hair_picker") {
        window.dispatchEvent(new CustomEvent("_invalidComparison", {detail: { curBlockType, comparedWith: "hair_picker" }, bubbles: true, composed: true}));
        highlightAssertBlocks(currentBlock, otherOperandBlock);
      } else if (otherOperand.match(/\b(hair)\b/)) {
        window.dispatchEvent(new CustomEvent("_invalidComparison", {detail: { curBlockType, comparedWith: "haircolor_prop" }, bubbles: true, composed: true}));
        highlightAssertBlocks(currentBlock, otherOperandBlock);
      }
    }
  }

  /**
   * Throws event if current block (child of math_number_property) is not of type number.
   * @param childblock
   * @param childblockJsCode
   */
  const _validityCheckInNumProperty = function (childblock, childblockJsCode) {
    if (childblock.type === "math_arithmetic" || childblock.type === "math_number") {
      // do nothing
    } else if ((childblock.type === "properties_user_healing" || childblock.type === "properties_user") && (childblockJsCode.match(/\b(size)\b/) || childblockJsCode.match(/\b(roundsCount)\b/)
            || childblockJsCode.match(/\b(innerRoundsCount)\b/) || childblockJsCode.match(/\b\w*BerryCount\w*\b/))){
      // do nothing
    } else {
      window.dispatchEvent(new CustomEvent("_invalidComparison", {detail: { curBlockType: "math_number_property", comparedWith: "notANumberAsChild" }, bubbles: true, composed: true}));
      highlightOneBlock(childblock);
    }
  }


  // Helper method to remove 'BlocklyOrder' number from the js string.
  // E.g. '"red",99' is returned as '"red"'
  const removeBlocklyOrderFromBlockCode = function (str) {
    const lastIndex = str.lastIndexOf(',');
    if (lastIndex !== -1) {
      return str.substring(0, lastIndex);
    } else {
      return str;
    }
  }

  /**
   * Checks if currently an assertion test is built and compares its input types
   * for validity.
   * @param event Blockly event on block moves or changes
   */
  var _onWorkspaceChange = function (event) {
    if (event.type === Blockly.Events.CHANGE || event.type === Blockly.Events.MOVE) {
      const eventreasons = event.reason;
      const isAutomaticallyCreateBlocksEvent = eventreasons && eventreasons[0] && eventreasons[0] === 'create';
      if (inHintMode && !isAutomaticallyCreateBlocksEvent) { // only dispatch event if is not creation of blocks (happens automatically, not by user)
        window.dispatchEvent(new CustomEvent("_userInteraction", {detail: { xml: getXML(), jsCode: getCode()}, bubbles: true, composed: true}));
      } else if (inHintMode) {
        return;
      }
      let parentBlock;
      const currentBlockId = event.blockId;
      const currentBlock = workspace.getBlockById(currentBlockId);
      if (currentBlock) {
        parentBlock = currentBlock.parentBlock_;
      }
      if (parentBlock && (parentBlock.type === "assert" || parentBlock.type === "assert_loop"
              || parentBlock.type === "logic_compare")) { // they all compare two values with each other
        _checkAssertValidity(currentBlock)
      } else if (parentBlock && (parentBlock.type === "math_number_property")) { // this must contain a number
        const childBlocks = parentBlock.childBlocks_;
        if (childBlocks[0].id === currentBlock.id) {
          const currentBlockJs = Blockly.JavaScript.blockToCode(currentBlock) ?
                  removeBlocklyOrderFromBlockCode(Blockly.JavaScript.blockToCode(currentBlock).toString()) : "";
          _validityCheckInNumProperty(currentBlock, currentBlockJs);
        }
      }
    }
  }


</script>
