<html>

<head>
  <title>Code Critters - Login</title>
  <script src="/lib/@webcomponents/webcomponentsjs/webcomponents-bundle.js"></script>

  <script type=module src="critter_components/critter-header/critter-header.js"></script>
  <script type=module src="critter_components/critter-translator/critter-translator-escaped.js"></script>
  <script type=module src="critter_components/critter-copyright/critter-copyright.js"></script>
  <script type=module src="critter_components/critter-login-page/critter-login-page.js"></script>


  <script>
    window.Polymer = window.Polymer || {};
    window.Polymer.dom = 'shadow';

    function _routeToLastWanted(event) {
      let level = new URL(window.location.href).searchParams.get("level");

      if (level) { // route to the wanted level if given
        window.location.reload();
      } else { // otherwise route to index
        window.location.href = "/";
      }
      window.dispatchEvent(new CustomEvent('_userChanged', {detail: {}, bubbles: true, composed: true}));
    }

    window.addEventListener("_refresh", (event) => _routeToLastWanted(event));

  </script>

  <link rel="stylesheet" href="/static/bootstrap/dist/css/bootstrap.min.css">


  <custom-style>
    <style>
      body {
        font-family: Arial;
        font-size: 0.8em;
        margin: 0;
      }

      #foreground_container {
        width: 100%;
        position: relative;
        height: 100vh;
        margin: auto;
        background-color: #F3F4F6;
        z-index: 2;
      }

      critter-button {
        width: 100px;
      }

      .text{
        text-align: center;
        margin: 5% 0;
      }

      hr {
        color: #ffa600;
        background-color: #ffa600;
        height: 3px;
        margin: 0;
      }

      #copyright {
        color: white;
        background-color: rgb(57, 58, 61);
      }

      #copyright_content {
        padding: 2%;
      }
    </style>

  </custom-style>

</head>
<body>
<div class="row">
  <div class="col-sm-12">
    <critter-header hide-login-buttons="true"></critter-header>
    <hr>
  </div>
</div>
<div id="foreground_container">
  <div class="row content justify-content-center align-items-center">
    <div class="col-sm-10 text">
        <critter-login-page></critter-login-page>
    </div>
  </div>
  <div class="row fixed-bottom">
    <div class="col-sm-12" id="copyright">
      <hr>
      <critter-copyright id="copyright_content"></critter-copyright>
    </div>
  </div>
</div>
</body>
</html>
