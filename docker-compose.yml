version: "3"

services:
  mysqldb:
    container_name: "critter-mysql"
    image: mariadb:11.1-rc
    ports:
      - "3306:3306"
    env_file: ./.env
    environment:
      MYSQL_ROOT_PASSWORD: $MYSQLDB_ROOT_PASSWORD
      MYSQL_PASSWORD: $MYSQLDB_ROOT_PASSWORD
      MYSQL_USER: $MYSQLDB_USER
      MYSQL_DATABASE: $MYSQLDB_DATABASE
    volumes:
      - ./init:/docker-entrypoint-initdb.d
  mailhog:
    container_name: "critter-mailhog"
    image: mailhog/mailhog:latest
    ports:
      - "8025:8025"
      - "1025:1025"
  app:
    build: .
    container_name: CCapp #CodeCrittersApp
    depends_on:
      - mysqldb
    restart: on-failure
    env_file: ./.env
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysqldb:3306/$MYSQLDB_DATABASE?useSSL=false
      - SPRING_DATASOURCE_USERNAME=$MYSQLDB_USER
      - SPRING_DATASOURCE_PASSWORD=$MYSQLDB_ROOT_PASSWORD
      - SPRING_JPA_HIBERNATE_DDL_AUTO=none
    stdin_open: true
    tty: true
